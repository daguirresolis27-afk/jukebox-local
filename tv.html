<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV - Cola de música</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; }

  #player-wrap { position: fixed; inset: 0; background: #000; }
  #player-wrap iframe { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; }

  #idle {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #1a1a2e, #16213e); color: #fff; text-align: center; z-index: 5;
  }
  #idle h1 { font-size: 48px; margin-bottom: 12px; }
  #idle p { color: #aaa; font-size: 22px; margin-bottom: 30px; }
  #idle img { border-radius: 16px; background: #fff; padding: 14px; }

  .hidden { display: none !important; }

  #sidebar {
    position: fixed; top: 0; right: 0; bottom: 0; width: 320px;
    background: linear-gradient(to left, rgba(0,0,0,0.85), rgba(0,0,0,0.55) 80%, transparent);
    padding: 24px 20px; color: #fff; z-index: 10; overflow-y: auto;
  }
  #sidebar h2 { font-size: 16px; margin: 0 0 14px; color: #ddd; text-transform: uppercase; letter-spacing: 0.05em; }
  #sidebar .item { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.12); font-size: 15px; }
  #sidebar .item b { display: block; color: #fff; }
  #sidebar .item span { color: #aaa; font-size: 13px; }
  #sidebar .now b { color: #2ed573; }

  .qr-corner {
    position: fixed; bottom: 16px; background: rgba(255,255,255,0.95); padding: 8px; border-radius: 10px; z-index: 20;
  }
  .qr-corner.left { left: 16px; }
  .qr-corner.right { right: 16px; }
  .qr-corner img { display: block; }
  .qr-corner p { text-align: center; color: #000; font-size: 11px; margin: 4px 0 0; font-weight: 600; }
</style>
</head>
<body>
  <div id="idle">
    <h1>🎶 ¡Pide tu música!</h1>
    <p>Escanea el código y añade tu canción a la cola</p>
    <img id="qr-big" width="280" height="280" alt="QR">
  </div>

  <div id="player-wrap" class="hidden">
    <div id="player"></div>
  </div>

  <div id="sidebar" class="hidden">
    <h2>En cola</h2>
    <div id="queue-list"></div>
  </div>

  <div id="qr-left" class="qr-corner hidden">
    <img id="qr-small-left" width="90" height="90" alt="QR">
    <p>Pide tu canción</p>
  </div>
  <div id="qr-right" class="qr-corner hidden">
    <img id="qr-small-right" width="90" height="90" alt="QR">
    <p>Pide tu canción</p>
  </div>

<script>
  // URL pública de la página de pedidos (index.html). Ajusta si tu repo cuelga de una subcarpeta.
  const REQUEST_URL = location.origin + location.pathname.replace(/tv\.html$/, "index.html");
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(REQUEST_URL)}`;
  document.getElementById("qr-big").src = qrUrl;
  document.getElementById("qr-small-left").src = qrUrl.replace("300x300", "150x150");
  document.getElementById("qr-small-right").src = qrUrl.replace("300x300", "150x150");
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, collection, query, where, orderBy, limit,
  onSnapshot, doc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const idleEl = document.getElementById("idle");
const playerWrap = document.getElementById("player-wrap");
const sidebar = document.getElementById("sidebar");
const qrLeft = document.getElementById("qr-left");
const qrRight = document.getElementById("qr-right");
const queueListEl = document.getElementById("queue-list");

let ytPlayer = null;
let ytReady = false;
let currentPlayingId = null; // doc id actualmente en reproducción
let currentVideoId = null;
let pendingQueue = []; // snapshot de docs waiting/playing, ordenados

// --- Carga la API de YouTube IFrame ---
const tag = document.createElement("script");
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function () {
  ytReady = true;
  tryStartNext();
};

function showIdle() {
  idleEl.classList.remove("hidden");
  playerWrap.classList.add("hidden");
  sidebar.classList.add("hidden");
  qrLeft.classList.add("hidden");
  qrRight.classList.add("hidden");
}

function showPlaying() {
  idleEl.classList.add("hidden");
  playerWrap.classList.remove("hidden");
  sidebar.classList.remove("hidden");
  qrLeft.classList.remove("hidden");
  qrRight.classList.remove("hidden");
}

function renderSidebar() {
  const current = pendingQueue.find(d => d.id === currentPlayingId);
  const upcoming = pendingQueue.filter(d => d.id !== currentPlayingId);

  let html = "";
  if (current) {
    html += `<div class="item now"><b>▶ ${escapeHtml(current.title || current.videoId)}</b><span>${escapeHtml(current.name)}</span></div>`;
  }
  html += upcoming.length
    ? upcoming.map(d => `<div class="item"><b>${escapeHtml(d.title || d.videoId)}</b><span>${escapeHtml(d.name)}</span></div>`).join("")
    : '<div class="item"><span>No hay nadie más en espera</span></div>';
  queueListEl.innerHTML = html;
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

async function markStatus(docId, status) {
  try {
    await updateDoc(doc(db, "queue", docId), { status });
  } catch (e) {
    console.error("No se pudo actualizar estado", e);
  }
}

function tryStartNext() {
  if (!ytReady) return;
  if (currentPlayingId) return; // ya hay algo sonando

  const next = pendingQueue.find(d => d.status === "waiting");
  if (!next) {
    if (pendingQueue.length === 0) showIdle();
    return;
  }

  currentPlayingId = next.id;
  currentVideoId = next.videoId;
  markStatus(next.id, "playing");
  showPlaying();
  renderSidebar();

  if (ytPlayer) {
    ytPlayer.loadVideoById(next.videoId);
  } else {
    ytPlayer = new YT.Player("player", {
      videoId: next.videoId,
      width: "100%",
      height: "100%",
      playerVars: { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1 },
      events: {
        onStateChange: onPlayerStateChange,
        onReady: () => ytPlayer.playVideo(),
      },
    });
  }
}

function onPlayerStateChange(event) {
  if (event.data === YT.PlayerState.ENDED) {
    const finished = currentPlayingId;
    currentPlayingId = null;
    currentVideoId = null;
    if (finished) markStatus(finished, "done");
    tryStartNext();
  }
}

// Escucha en tiempo real la cola (waiting + playing), ordenada por llegada
const q = query(
  collection(db, "queue"),
  where("status", "in", ["waiting", "playing"]),
  orderBy("order", "asc"),
  limit(50)
);

onSnapshot(q, (snap) => {
  pendingQueue = snap.docs.map(d => ({ id: d.id, ...d.data() }));

  // Si lo que estaba sonando ya no está en la lista (lo borraron desde admin), reinicia
  if (currentPlayingId && !pendingQueue.some(d => d.id === currentPlayingId)) {
    currentPlayingId = null;
    currentVideoId = null;
    if (ytPlayer) ytPlayer.stopVideo();
  }

  renderSidebar();
  tryStartNext();

  if (pendingQueue.length === 0 && !currentPlayingId) showIdle();
}, (err) => {
  console.error("Error escuchando la cola", err);
});
</script>
</body>
</html>
